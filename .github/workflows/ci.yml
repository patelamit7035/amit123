name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}

jobs:
  app:
    name: Lint, typecheck and test the app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: Test the Supabase schema, RLS and RPCs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub's Ubuntu runners ship PostgreSQL, but the server must not run as
      # root, so the suite runs as the unprivileged runner user.
      - run: npm run test:db
